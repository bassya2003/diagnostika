<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sana Space — прототип</title>
<style>
:root{
  --bg:#0f1226; --card:#1a1f3d; --card2:#232a52; --ink:#f2f4ff; --muted:#9aa3d0;
  --acc:#6c8cff; --acc2:#38d1b0; --warn:#ffb454; --danger:#ff6b81;
  --grad:linear-gradient(135deg,#6c8cff 0%,#38d1b0 100%);
  --r:18px; --sh:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; min-height:100vh}
#app{max-width:520px; margin:0 auto; padding:16px 16px 90px}
.topbar{display:flex; justify-content:space-between; align-items:center; padding:10px 2px 18px}
.logo{font-weight:800; font-size:18px; letter-spacing:.3px}
.logo span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.langsw{display:flex; gap:6px}
.langsw button{border:1px solid #333a6e; background:transparent; color:var(--muted); border-radius:10px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:13px}
.langsw button.on{background:var(--grad); color:#0b0e20; border-color:transparent}
.card{background:var(--card); border-radius:var(--r); padding:22px; box-shadow:var(--sh); margin-bottom:14px}
.card.soft{background:var(--card2)}
h1{font-size:24px; line-height:1.25; margin-bottom:10px}
h2{font-size:19px; margin-bottom:8px}
p{line-height:1.5; color:var(--muted); font-size:15px}
p.ink{color:var(--ink)}
.btn{display:block; width:100%; border:none; border-radius:14px; padding:15px 18px; font-size:16px; font-weight:800; cursor:pointer; background:var(--grad); color:#0b0e20; margin-top:14px}
.btn.ghost{background:transparent; border:1.5px solid #39407a; color:var(--ink); font-weight:600}
.btn.mini{width:auto; padding:9px 14px; font-size:13px; display:inline-block; margin-top:8px}
.btn:disabled{opacity:.4; cursor:default}
.row{display:flex; gap:10px}
.row .btn{flex:1}
input[type=text],input[type=number],textarea,select{width:100%; background:#141936; border:1.5px solid #333a6e; color:var(--ink); border-radius:12px; padding:13px 14px; font-size:15px; margin-top:8px; font-family:inherit}
textarea{min-height:88px; resize:vertical}
label.f{display:block; margin-top:14px; font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{border:1.5px solid #333a6e; background:#141936; color:var(--ink); border-radius:999px; padding:9px 15px; font-size:14px; cursor:pointer; font-weight:600}
.chip.on{background:var(--grad); color:#0b0e20; border-color:transparent}
.scale{display:flex; gap:5px; margin-top:10px; flex-wrap:nowrap}
.scale button{flex:1; aspect-ratio:1; min-width:0; border:1.5px solid #333a6e; background:#141936; color:var(--muted); border-radius:9px; font-weight:800; cursor:pointer; font-size:13px}
.scale button.on{background:var(--grad); color:#0b0e20; border-color:transparent}
.prog{height:7px; background:#232a52; border-radius:99px; overflow:hidden; margin:6px 0 16px}
.prog i{display:block; height:100%; background:var(--grad); border-radius:99px; transition:width .3s}
.daygrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.day{background:var(--card); border-radius:16px; padding:16px; cursor:pointer; border:1.5px solid transparent; position:relative}
.day.done{border-color:var(--acc2)}
.day.lock{opacity:.45; cursor:default}
.day .dn{font-size:11px; font-weight:800; color:var(--acc); text-transform:uppercase; letter-spacing:.5px}
.day .dt{font-weight:800; margin-top:4px; font-size:15px}
.day .ds{font-size:12px; color:var(--muted); margin-top:4px}
.day .ok{position:absolute; top:10px; right:12px; color:var(--acc2); font-weight:900}
.opt{display:block; width:100%; text-align:left; background:#141936; border:1.5px solid #333a6e; color:var(--ink); border-radius:14px; padding:15px; font-size:15px; line-height:1.4; cursor:pointer; margin-top:10px; font-family:inherit}
.opt.on{border-color:var(--acc); background:#1b2350}
.tag{display:inline-block; font-size:11px; font-weight:800; padding:4px 10px; border-radius:99px; background:#232a52; color:var(--acc); margin-bottom:8px; letter-spacing:.4px; text-transform:uppercase}
.swipecard{background:var(--card2); border-radius:20px; padding:34px 22px; text-align:center; font-size:19px; font-weight:700; line-height:1.4; min-height:170px; display:flex; align-items:center; justify-content:center; box-shadow:var(--sh)}
.swipebtns{display:flex; gap:10px; margin-top:16px}
.swipebtns button{flex:1; border:none; border-radius:14px; padding:14px 6px; font-weight:800; font-size:14px; cursor:pointer}
.sb-no{background:#3d2038; color:var(--danger)}
.sb-mid{background:#232a52; color:var(--muted)}
.sb-yes{background:#123f38; color:var(--acc2)}
.profgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px}
.prof{border:1.5px solid #333a6e; background:#141936; border-radius:13px; padding:12px; font-size:13.5px; font-weight:600; cursor:pointer; text-align:center; color:var(--ink)}
.prof.on{border-color:var(--danger); background:#33203a}
.bar{margin-top:12px}
.bar .bl{display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-bottom:4px}
.bar .bt{height:9px; background:#232a52; border-radius:99px; overflow:hidden}
.bar .bt i{display:block; height:100%; background:var(--grad); border-radius:99px}
.note{font-size:12.5px; color:var(--muted); border-left:3px solid var(--warn); padding:8px 12px; background:#1d1c33; border-radius:0 10px 10px 0; margin-top:12px; line-height:1.45}
.ai{display:flex; gap:10px; margin-top:14px}
.ai .av{width:34px; height:34px; border-radius:50%; background:var(--grad); flex:none; display:flex; align-items:center; justify-content:center; font-weight:900; color:#0b0e20; font-size:13px}
.ai .bub{background:var(--card2); border-radius:4px 16px 16px 16px; padding:13px 15px; font-size:15px; line-height:1.5}
.me{background:#1b2350; border-radius:16px 4px 16px 16px; padding:13px 15px; font-size:15px; line-height:1.5; margin:12px 0 0 44px}
.footer{position:fixed; bottom:0; left:0; right:0; text-align:center; padding:10px; font-size:11px; color:#5a6296; background:linear-gradient(transparent,var(--bg) 40%)}
.center{text-align:center}
.big{font-size:42px; margin:10px 0}
.report h3{margin:18px 0 6px; font-size:16px; color:var(--acc)}
.report .sec{background:var(--card2); border-radius:14px; padding:16px; margin-top:10px}
.report p{font-size:14px; margin-top:6px}
.pill{display:inline-block; background:#232a52; border-radius:99px; padding:5px 12px; font-size:12.5px; font-weight:700; margin:4px 4px 0 0; color:var(--ink)}
.micbtn{width:auto; padding:8px 14px; font-size:13px; margin-top:8px; display:inline-block; background:transparent; border:1.5px solid #39407a; color:var(--muted); border-radius:99px; font-weight:700; cursor:pointer}
.micbtn.rec{border-color:var(--danger); color:var(--danger); animation:recpulse 1.2s infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.55}}
.demo{position:fixed; bottom:34px; right:14px; background:#232a52; color:var(--warn); border:1px solid #3a3560; border-radius:99px; padding:8px 14px; font-size:12px; font-weight:800; cursor:pointer; z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div class="footer" id="foot"></div>
<script>


"use strict";
/* ─── ПОДКЛЮЧЕНИЕ (настройка — см. Настройка_автосбора_и_ИИ.md) ─── */
const CONFIG = {
  RESULTS_URL: "https://script.google.com/macros/s/AKfycbyQrCVzWgvQEkfz8jUso22TAHOV2mEQvGhtAncpTtXja-_CWdNqUl0VGv4ayEg5X7ehxA/exec",
  AI_URL: "/api/chat"     // живой ИИ: заработает автоматически после настройки Netlify Function
};
let aiOff=false;          // авто-откл. ИИ, если сервер недоступен
/* ============================================================
   SANA SPACE — интерактивный прототип пути подростка (v0.9)
   Весь контент — уникальная база Sana Space (Сессии 1–3).
   Казахские тексты — черновик до вычитки носителем.
   ============================================================ */

/* ---------- UI-строки ---------- */
const UI = {
  appname:{r:"Sana Space", k:"Sana Space"},
  tagline:{r:"Твоя карта профессий за 7 дней", k:"7 күнде — сенің мамандық картаң"},
  start:{r:"Начать путешествие", k:"Саяхатты бастау"},
  cont:{r:"Продолжить", k:"Жалғастыру"},
  next:{r:"Дальше", k:"Әрі қарай"},
  done:{r:"Готово", k:"Дайын"},
  home:{r:"К карте дней", k:"Күндер картасына"},
  day:{r:"День", k:"Күн"},
  of:{r:"из", k:"/"},
  answer_ph:{r:"Напиши свой ответ… (в полной версии можно наговорить голосом)", k:"Жауабыңды жаз… (толық нұсқада дауыспен айтуға болады)"},
  skip:{r:"Пропустить", k:"Өткізіп жіберу"},
  like:{r:"Нравится", k:"Ұнайды"},
  mid:{r:"Всё равно", k:"Бәрібір"},
  dislike:{r:"Не нравится", k:"Ұнамайды"},
  demo_fill:{r:"⚡ Демо: заполнить день", k:"⚡ Демо: күнді толтыру"},
  locked:{r:"Откроется после предыдущего дня", k:"Алдыңғы күннен кейін ашылады"},
  report_btn:{r:"Черновик отчета (режим консультанта)", k:"Есеп жобасы (кеңесші режимі)"},
  onb_title:{r:"Давай познакомимся", k:"Танысайық"},
  onb_name:{r:"Как тебя зовут?", k:"Атың кім?"},
  onb_age:{r:"Сколько тебе лет?", k:"Жасың нешеде?"},
  onb_city:{r:"Твой город", k:"Қалаң"},
  onb_track:{r:"Где ты планируешь учиться после школы?", k:"Мектептен кейін қайда оқуды жоспарлайсың?"},
  tr_kz:{r:"В Казахстане", k:"Қазақстанда"},
  tr_ab:{r:"За рубежом", k:"Шетелде"},
  tr_both:{r:"Рассматриваю оба варианта", k:"Екі нұсқаны да қарастырамын"},
  tr_und:{r:"Пока не знаю", k:"Әзірше білмеймін"},
  onb_vol:{r:"Ты сам(а) решил(а) пройти программу?", k:"Бағдарламадан өтуді өзің шештің бе?"},
  vol_yes:{r:"Да, это мой выбор", k:"Иә, бұл — өз таңдауым"},
  vol_no:{r:"Меня записали родители/школа", k:"Мені ата-анам/мектеп жазды"},
  vol_msg:{r:"Понимаю. Иногда просто приходит время выбирать — и кто-то пытается помочь. Дай этой программе шанс: тут не школа, тут всё — про тебя. Получится включиться — будет результат, важный для тебя.", k:"Түсінемін. Кейде таңдау уақыты жай ғана келеді — және біреу көмектескісі келеді. Осы бағдарламаға мүмкіндік бер: бұл мектеп емес, мұнда бәрі — сен туралы. Қосыла алсаң — өзіңе маңызды нәтиже болады."},
  contract:{r:"Мой договор с собой: я отвечаю честно — не «как надо», а как есть. Мои ответы — основа моей карты профессий.", k:"Өзіммен келісімім: мен адал жауап беремін — «қалай керек» емес, қалай бар солай. Менің жауаптарым — мамандық картамның негізі."},
  contract_ok:{r:"Принимаю ✋", k:"Қабылдаймын ✋"},
  kz_draft:{r:"Прототип v0.7 · казахская версия вычитана · автосбор включен", k:"Прототип v0.7 · қазақшасы тексерілді · автожинау қосулы"},
  synth_wait:{r:"Спасибо за эту неделю! Ты рассказал(а) о себе очень много важного. Сейчас всё это уходит эксперту — твой отчет будет готов в ближайшие дни.", k:"Осы апта үшін рахмет! Сен өзің туралы көп маңызды нәрсе айттың. Енді бәрі сарапшыға жіберіледі — есебің жақын күндері дайын болады."},
};

/* ---------- Дни программы ---------- */
const DAYS = [
  {id:1, icon:"🎪", title:{r:"30 дней до фестиваля", k:"Фестивальге дейін 30 күн"}, sub:{r:"Игра-квест", k:"Ойын-квест"}},
  {id:2, icon:"🔍", title:{r:"ЛУПа", k:"ЛУПа"}, sub:{r:"Что ты любишь", k:"Нені жақсы көресің"}},
  {id:3, icon:"🎙️", title:{r:"Твоя история", k:"Сенің хикаяң"}, sub:{r:"Интервью", k:"Сұхбат"}},
  {id:4, icon:"🧭", title:{r:"Карта векторов", k:"Векторлар картасы"}, sub:{r:"Свайпы + антирейтинг", k:"Свайптар + антирейтинг"}},
  {id:5, icon:"💎", title:{r:"Что для тебя важно", k:"Сен үшін не маңызды"}, sub:{r:"Ценности и якоря", k:"Құндылықтар мен якорьлар"}},
  {id:6, icon:"🌀", title:{r:"Мультивселенная", k:"Мультиғалам"}, sub:{r:"7 порталов", k:"7 портал"}},
  {id:7, icon:"🐋", title:{r:"Три кита и деньги", k:"Үш кит және ақша"}, sub:{r:"Смысл + ожидания", k:"Мағына + күтулер"}},
  {id:8, icon:"✨", title:{r:"Синтез", k:"Синтез"}, sub:{r:"Собираем картину", k:"Бейнені құрастырамыз"}},
];

/* ---------- Состояние ---------- */
let S = load() || {
  lang:"ru", screen:"welcome", profile:{}, doneDays:[], cur:null,
  res:{ game:{pattern:[], open:{}, }, lupa:{subjects:{},activities:{},probes:{}}, narrative:{},
        riasec:{}, anti:{picks:[],reasons:{}}, values:{}, schein:{}, scen:{}, whales:{}, money:{}, synth:{} }
};
function save(){ try{ localStorage.setItem("sana_proto", JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem("sana_proto")); }catch(e){ return null; } }
function T(o){ return o[S.lang==="kz"?"k":"r"]; }
function t(key){ return T(UI[key]); }
function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d; }
function app(){ return document.getElementById("app"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- Каркас ---------- */
function topbar(){
  return `<div class="topbar">
    <div class="logo"><span>Sana</span> Space</div>
    <div class="langsw">
      <button class="${S.lang==='ru'?'on':''}" onclick="setLang('ru')">РУС</button>
      <button class="${S.lang==='kz'?'on':''}" onclick="setLang('kz')">ҚАЗ</button>
    </div></div>`;
}
function setLang(l){ S.lang=l; save(); render(); }
function go(screen){ S.screen=screen; save(); window.scrollTo(0,0); render(); }
function render(){
  document.getElementById("foot").textContent = t("kz_draft");
  const scr = SCREENS[S.screen] || SCREENS.welcome;
  app().innerHTML = topbar();
  scr();
  addMics();
  save();
}
/* ─── Голосовой ввод (Web Speech API, бесплатно, работает не во всех браузерах) ─── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recAct = null;
function addMics(){
  if(!SR) return;
  document.querySelectorAll("textarea").forEach(ta=>{
    if(ta.dataset.mic) return; ta.dataset.mic="1";
    const b=document.createElement("button");
    b.type="button"; b.className="micbtn";
    b.textContent="🎤 "+(S.lang==='kz'?"Дауыспен айту":"Наговорить голосом");
    b.onclick=(e)=>{ e.preventDefault(); toggleDict(ta,b); };
    ta.insertAdjacentElement("afterend", b);
  });
}
function toggleDict(ta,b){
  if(recAct){ try{recAct.stop();}catch(e){} return; }
  let r; try{ r=new SR(); }catch(e){ b.style.display="none"; return; }
  r.lang = S.lang==='kz' ? 'kk-KZ' : 'ru-RU';
  r.interimResults=false; r.continuous=true; r.maxAlternatives=1;
  recAct=r;
  b.classList.add("rec");
  b.textContent="⏹ "+(S.lang==='kz'?"Тоқтату (жазылуда…)":"Стоп (запись идет…)");
  r.onresult=(e)=>{
    let txt="";
    for(let i=e.resultIndex;i<e.results.length;i++) txt+=e.results[i][0].transcript+" ";
    ta.value=(ta.value+" "+txt).replace(/\s+/g," ").trim();
  };
  r.onerror=()=>{ try{r.stop();}catch(e){} };
  r.onend=()=>{
    recAct=null; b.classList.remove("rec");
    b.textContent="🎤 "+(S.lang==='kz'?"Дауыспен айту":"Наговорить голосом");
  };
  try{ r.start(); }catch(e){ recAct=null; }
}

/* ---------- Экраны: приветствие и онбординг ---------- */
const SCREENS = {};

SCREENS.welcome = function(){
  app().insertAdjacentHTML("beforeend", `
    <div class="card center">
      <div class="big">🧭</div>
      <h1>${t("tagline")}</h1>
      <p>${S.lang==='kz'
        ? "Бұл тест емес — бұл сен туралы 7 күндік зерттеу. Ойын, сұхбаттар және ашылулар. Соңында сарапшы саған жеке есеп дайындайды."
        : "Это не тест — это 7-дневное исследование о тебе. Игра, интервью и открытия. В конце эксперт подготовит твой личный отчет."}</p>
      <button class="btn" onclick="go('onboard')">${t("start")}</button>
      ${S.doneDays.length? `<button class="btn ghost" onclick="go('home')">${t("cont")}</button>`:""}
    </div>`);
};

SCREENS.onboard = function(){
  const p = S.profile;
  app().insertAdjacentHTML("beforeend", `
    <div class="card">
      <h2>${t("onb_title")}</h2>
      <label class="f">${t("onb_name")}</label><input type="text" id="o_name" value="${p.name||""}">
      <label class="f">${t("onb_age")}</label><input type="number" id="o_age" min="12" max="19" value="${p.age||""}">
      <label class="f">${t("onb_city")}</label><input type="text" id="o_city" value="${p.city||""}">
      <label class="f">${t("onb_track")}</label>
      <div class="chips" id="o_track">
        ${[["kz",t("tr_kz")],["abroad",t("tr_ab")],["both",t("tr_both")],["undecided",t("tr_und")]]
          .map(x=>`<div class="chip ${p.track===x[0]?'on':''}" onclick="pickTrack('${x[0]}')">${x[1]}</div>`).join("")}
      </div>
      <label class="f">${t("onb_vol")}</label>
      <div class="chips">
        <div class="chip ${p.voluntary===true?'on':''}" onclick="pickVol(true)">${t("vol_yes")}</div>
        <div class="chip ${p.voluntary===false?'on':''}" onclick="pickVol(false)">${t("vol_no")}</div>
      </div>
      ${p.voluntary===false? `<div class="note">${t("vol_msg")}</div>`:""}
      <div class="note">${S.lang==='kz'?"Толық нұсқада: ата-ананың келісімі және құпиялылық туралы келісім. Сенің ИИ-мен чатың — жеке кеңістік, оны ата-ана да, мектеп те көрмейді.":"В полной версии здесь: согласие родителя и соглашение о конфиденциальности. Твой чат с ИИ — личное пространство: его не видят ни родители, ни школа."}</div>
      <div class="card soft" style="margin-top:14px"><p class="ink">${t("contract")}</p></div>
      <button class="btn" onclick="finishOnboard()">${t("contract_ok")}</button>
    </div>`);
};
function readOnboard(){
  const n=document.getElementById("o_name"), a=document.getElementById("o_age"), c=document.getElementById("o_city");
  if(n) S.profile.name=n.value;
  if(a) S.profile.age=a.value;
  if(c) S.profile.city=c.value;
}
function pickTrack(v){ readOnboard(); S.profile.track=v; save(); render(); }
function pickVol(v){ readOnboard(); S.profile.voluntary=v; save(); render(); }
function finishOnboard(){
  readOnboard();

      <div class="daygrid">

          const done = S.doneDays.includes(d.id);
          const locked = d.id>1 && !S.doneDays.includes(d.id-1) && !done;
          return `<div class="day ${done?'done':''} ${locked?'lock':''}" onclick="${locked?'':'openDay('+d.id+')'}">

        }).join("")}

/* Кнопка "Демо: пройти всё" — только для показов школам/инвесторам.
   Скрыта от обычных пользователей, чтобы её случайно не нажали и не затёрли
   реальное имя/ответы тестовым профилем "Демо Айым". Включается ссылкой ?demo=1. */
const DEMO_MODE = new URLSearchParams(location.search).get("demo")==="1";
/* Демо-заполнение всего пути (для показов школам/инвесторам) */
function demoAll(){
  S.profile={name:"Демо Айым",age:15,city:"Алматы",track:"both",voluntary:true};
  S.isDemo=true;
  S.sentOk=false; sendState="";
  DEMO_FILLERS.forEach(f=>f()); S.doneDays=[1,2,3,4,5,6,7,8]; save(); go("home");
}
const DEMO_FILLERS = [];
function exportData(){
  return {app:"sana_space_prototype", exported:new Date().toISOString(), isDemo:!!S.isDemo,
    profile:S.profile, doneDays:S.doneDays, res:S.res,
    scores:{riasec:riasecScores(), mcclelland:mccScores(), schein:schScores(), values:valScores()}};
}
let sendState="";
async function maybeSendResults(){
  if(!CONFIG.RESULTS_URL || S.sentOk || sendState==="sending") return;
  sendState="sending"; render();
  try{
    await fetch(CONFIG.RESULTS_URL,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain"},body:JSON.stringify(exportData())});
    S.sentOk=true; sendState="ok"; save();
  }catch(e){ sendState="err"; }
  render();
}
async function aiAsk(messages){
  if(!CONFIG.AI_URL || aiOff) return "";
  try{
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),20000);
    const r=await fetch(CONFIG.AI_URL,{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode:"day3",lang:S.lang,messages})});
    clearTimeout(tm);
    if(!r.ok){ aiOff=true; return ""; }
    const d=await r.json(); return (d.text||"").trim();
  }catch(e){ aiOff=true; return ""; }
}
function exportResults(){
  const data=exportData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="sana_"+((S.profile.name||"user").replace(/\s+/g,"_"))+".json"; a.click();
}

let g_i = -1, g_probe = false;

    app().insertAdjacentHTML("beforeend", `
      <div class="card"><div class="tag">${t("day")} 1 · ${S.lang==='kz'?'Ойын':'Игра'}</div>

    return;
  }
  if(g_i >= GAME.scenes.length){
    app().insertAdjacentHTML("beforeend", `
      <div class="card center"><div class="big">🏅</div>
      <h2>${S.lang==='kz'?'Фестиваль өтті!':'Фестиваль состоялся!'}</h2>

      <button class="btn" onclick="g_i=-1;completeDay(1)">${t("home")}</button></div>`);
    return;
  }
  const sc = GAME.scenes[g_i];
  const picked = S.res.game.pattern[g_i];
  if(g_probe && sc.probe){
    const chosenOpt = sc.o.find(o=>o.t===picked);
    app().insertAdjacentHTML("beforeend", `
      <div class="card"><div class="tag">${S.lang==='kz'?'Тәлімгер':'Наставник'}</div>
      <div class="ai"><div class="av">S</div><div class="bub">${chosenOpt? (S.lang==='kz'?'Сен таңдадың':'Ты выбрал(а)')+": «"+T(chosenOpt)+"». ":""}${T(sc.probe)}</div></div>
      <textarea id="g_open" placeholder="${t('answer_ph')}">${S.res.game.open[g_i]||""}</textarea>
      <button class="btn" onclick="gProbeDone()">${t("next")}</button></div>`);
    return;
  }
  const opts = sc._sh || (sc._sh = shuffle(sc.o));
  app().insertAdjacentHTML("beforeend", `
    <div class="card"><div class="tag">${sc.d>30? (S.lang==='kz'?'Фестивальден кейінгі түн':'Ночь после фестиваля') : (S.lang==='kz'?'Күн':'День')+" "+sc.d+" / 30"}</div>
    <div class="prog"><i style="width:${(g_i)/GAME.scenes.length*100}%"></i></div>
    <h2>${T(sc.q)}</h2>
    ${opts.map((o,idx)=>`<button class="opt ${picked===o.t?'on':''}" onclick="gPick(${g_i},'${o.t}')">${T(o)}</button>`).join("")}
    </div>`);
};
function gPick(i, tag){
  S.res.game.pattern[i]=tag; save();
  const sc = GAME.scenes[i];
  if(sc.probe){ g_probe=true; render(); }
  else { g_i++; render(); }
}
function gProbeDone(){
  S.res.game.open[g_i] = document.getElementById("g_open").value||"";
  g_probe=false; g_i++; save(); render();
}

function lSet(kind,id,n){ S.res.lupa[kind][id]=n; save(); render(); }
function lupaProbes(){
  const R=S.res.lupa, out=[];
  const all=[...LUPA.subjects.map(x=>({...x,score:R.subjects[x.id],kind:'s'})),...LUPA.activities.map(x=>({...x,score:R.activities[x.id],kind:'a'}))];
  const ext = all.filter(x=>x.score<=2||x.score>=9).sort((a,b)=>Math.abs(5.5-b.score)-Math.abs(5.5-a.score));
  return ext.slice(0,4).map(x=>({id:x.id,label:T(x),score:x.score}));
}
function lProbesDone(){
  lupaProbes().forEach(p=>{ const v=document.getElementById("lp_"+p.id); if(v) S.res.lupa.probes[p.id]=v.value||""; });
  l_stage=4; save(); render();
}

async function nNext(skip){
  const q=NARR[n_i];
  const el=document.getElementById("n_a");
  const val=skip?"":(el?el.value:"")||"";
  if(!skip){ S.res.narrative[q.id]=val; save(); }
  if(!skip && val.replace(/\s+/g," ").length>12 && CONFIG.AI_URL && !aiOff){
    n_wait=true; render();
    const rep=await aiAsk([{role:"user",content:(S.lang==='kz'?"Сұхбат сұрағы: ":"Вопрос интервью: ")+T(q.q)+"\n"+(S.lang==='kz'?"Жасөспірімнің жауабы: ":"Ответ подростка: ")+val}]);
    n_wait=false;
    if(rep){ n_fu=rep; render(); return; }
  }
  n_i++; n_fu=null; save(); render();
}
function nFollowDone(){
  const q=NARR[n_i];
  S.res.narrative[q.id+"_ai_q"]=n_fu;

  n_fu=null; n_i++; save(); render();
}

function rAns(idx,val){ S.res.riasec[idx]=val; r_i++; save(); render(); }
function aPick(id){
  const p=S.res.anti.picks;
  if(p.includes(id)) S.res.anti.picks=p.filter(x=>x!==id);
  else if(p.length<5) p.push(id);
  save(); render();
}
function aDone(){
  S.res.anti.picks.forEach(id=>{const v=document.getElementById("ar_"+id); if(v) S.res.anti.reasons[id]=v.value||"";});
  r_stage=4; save(); render();
}
function riasecScores(){
  const sum={R:0,I:0,A:0,S:0,E:0,C:0}, cnt={R:0,I:0,A:0,S:0,E:0,C:0};
  RIASEC.forEach((x,i)=>{ if(S.res.riasec[i]!==undefined){ sum[x.v]+=S.res.riasec[i]; cnt[x.v]++; }});
  const out={}; Object.keys(sum).forEach(k=>out[k]= cnt[k]? +(sum[k]/cnt[k]).toFixed(2) : 0);
  return out;
}

function schScores(){
  const sum={},cnt={}; Object.keys(SCH_SCALES).forEach(k=>{sum[k]=0;cnt[k]=0;});
  SCHEIN.forEach((x,i)=>{ if(S.res.schein[i]){sum[x.s]+=S.res.schein[i]; cnt[x.s]++;} });
  const out={}; Object.keys(sum).forEach(k=>out[k]=cnt[k]?Math.round(sum[k]/cnt[k]):0);
  return out; // /10
}

    <label class="f">${T(MULTI.f_who)}</label><input type="text" id="${prefix}_who" value="${store.who||""}">
    <label class="f">${T(MULTI.f_where)}</label><input type="text" id="${prefix}_where" value="${store.where||""}">
    <div class="chips">${MULTI.geo.map(g=>`<div class="chip" onclick="document.getElementById('${prefix}_where').value='${T(g)}'">${T(g)}</div>`).join("")}</div>
    <label class="f">${T(MULTI.f_give)}</label><input type="text" id="${prefix}_give" value="${store.give||""}">
    <label class="f">${T(MULTI.f_happy)}</label><textarea id="${prefix}_happy" placeholder="${t('answer_ph')}">${store.happy||""}</textarea>`;
}
function mvRead(store, prefix){
  ["who","where","give","happy"].forEach(k=>{ const v=document.getElementById(prefix+"_"+k); if(v) store[k]=v.value||""; });
}

function findConflicts(){
  const sch=schScores(), ria=riasecScores(), val=valScores(), out=[];
  if(sch.serve>=6 && ria.S<=0.35) out.push({r:"Ты хочешь, чтобы твоя работа помогала людям (служение "+sch.serve+"/10) — но занятия «про людей» тебя не привлекают (социальный вектор "+ria.S+"). Как думаешь, можно ли помогать людям, не работая с ними лицом к лицу?", k:"Жұмысың адамдарға көмектескенін қалайсың (қызмет ету "+sch.serve+"/10) — бірақ «адамдармен» істер сені қызықтырмайды (әлеуметтік вектор "+ria.S+"). Қалай ойлайсың, адамдармен бетпе-бет жұмыс істемей-ақ көмектесуге бола ма?"});
  if(sch.stabw>=7 && (sch.entr>=7||sch.auto>=8)) out.push({r:"Тебе важна и надежность работы ("+sch.stabw+"/10), и свобода со своим делом. Эти желания часто тянут в разные стороны. Что из них ты выбрал бы, если бы пришлось?", k:"Саған жұмыс сенімділігі де ("+sch.stabw+"/10), өз ісіңмен еркіндік те маңызды. Бұл қалаулар жиі әр жаққа тартады. Таңдауға тура келсе, қайсысын таңдар едің?"});
  const selfdoubt = S.res.anti.picks.filter(id=>/не потяну|не настолько|сложно поступить|не получится|қолымнан келмейді|жетпейді/i.test(S.res.anti.reasons[id]||""));
  selfdoubt.forEach(id=>{ const p=ANTI.find(x=>x.id===id);
    out.push({r:"Про профессию «"+p.r+"» ты сказал(а): «"+S.res.anti.reasons[id]+"». А если бы точно получилось — само дело тебе интересно?", k:"«"+p.k+"» мамандығы туралы: «"+S.res.anti.reasons[id]+"» дедің. Ал нақты қолыңнан келсе — істің өзі саған қызық па?", sd:true});
  });
  if(S.res.multi && S.res.multi.pride && S.res.multi.pride.who){
    const pw=S.res.multi.pride.who.toLowerCase();
    const freeL=S.res.multi.lives.slice(0,3).filter(l=>l.who);
    const overlap=freeL.some(l=>{const w=l.who.toLowerCase();const a=w.split(/[\s-]+/)[0],b=pw.split(/[\s-]+/)[0];return a&&b&&(w.includes(b)||pw.includes(a));});
    if(freeL.length && !overlap){
      const names=freeL.map(l=>l.who).join(", ");
      out.push({r:"Я заметил кое-что в твоей Мультивселенной. В свободных мирах ты — "+names+". А в «Мире гордости» — "+S.res.multi.pride.who+". Интересно, правда? Как думаешь, чья это мечта?",
                k:"Мультиғаламыңнан бір нәрсе байқадым. Еркін әлемдерде сен — "+names+". Ал «Мақтаныш әлемінде» — "+S.res.multi.pride.who+". Қызық емес пе? Қалай ойлайсың, бұл кімнің арманы?", pride:true});
    }
  }
  return out.slice(0,3);
}

  integ:{r:"Жизнь больше работы: баланс с семьей, друзьями, увлечениями.",k:"Өмір жұмыстан үлкен: отбасы, достар, қызығушылықтармен тепе-теңдік."},
  entr:{r:"Хочет создавать свое: дело, продукт, проект со своим именем.",k:"Өзінікін жасағысы келеді: іс, өнім, өз есімімен жоба."}
};
const VAL_TIP = {
  dev:{r:"Главная валюта — рост: новые навыки, уровни, горизонты.",k:"Басты валюта — өсу: жаңа дағдылар, деңгейлер."},
  spirit:{r:"Дело должно быть интересно само по себе — процесс важнее зарплаты.",k:"Іс өзі қызықты болуы керек — процесс жалақыдан маңызды."},
  creat:{r:"Важно создавать новое и делать по-своему; рутина гасит.",k:"Жаңаны жасау және өзінше істеу маңызды; бірсарындылық сөндіреді."},
  soc:{r:"Люди — источник энергии: команда, общение, «свои» рядом.",k:"Адамдар — қуат көзі: команда, қарым-қатынас."},
  prest:{r:"Важно признание и уважение к профессии. Риск: выбрать «престижное» вместо «своего».",k:"Мойындалу мен құрмет маңызды. Қауіп: «өзінікінің» орнына «беделдіні» таңдау."},
  money:{r:"Важен достойный доход; смотреть на доходность сфер — но платят специалистам, а не профессиям.",k:"Лайықты табыс маңызды; ақшаны мамандыққа емес, мықты мамандарға төлейді."},
  achieve:{r:"Человек результата: цели, финиши, измеримые итоги.",k:"Нәтиже адамы: мақсаттар, өлшенетін қорытындылар."},
  indiv:{r:"Важно оставаться собой; привлекают редкие и необычные пути.",k:"Өзі болып қалу маңызды; сирек жолдар қызықтырады."}
};
function mccScores(){
  const w={P:0,A:0,D:0}; let n=0;
  S.res.game.pattern.forEach((tg,i)=>{ if(tg){ const wt = i===7?2:1; w[tg]+=wt; n+=wt; }});
  const out={}; Object.keys(w).forEach(k=>out[k]= n? Math.round(w[k]/n*100):0);
  return out;
}
function bars(entries, max, names, tips){
  return entries.map(([k,v])=>`<div class="bar">
    <div class="bl"><span>${T(names[k])}</span><b>${v}${max===1?"":"/"+max}</b></div>
    <div class="bt"><i style="width:${(max===1?v:v/max)*100}%"></i></div>
    ${tips&&tips[k]?`<p style="font-size:12.5px;margin-top:3px">${T(tips[k])}</p>`:""}
  </div>`).join("");
}
SCREENS.report = function(){
  const ria=riasecScores(), mcc=mccScores(), sch=schScores(), val=valScores();
  const riaSorted=Object.entries(ria).sort((a,b)=>b[1]-a[1]);
  const schSorted=Object.entries(sch).sort((a,b)=>b[1]-a[1]);
  const valSorted=Object.entries(val).sort((a,b)=>b[1]-a[1]);
  const topVec=riaSorted.slice(0,3).filter(x=>x[1]>=0.5);
  const lupaTop=[...LUPA.subjects.map(x=>({...x,sc:S.res.lupa.subjects[x.id]||0})),...LUPA.activities.map(x=>({...x,sc:S.res.lupa.activities[x.id]||0}))].filter(x=>x.sc>=7).sort((a,b)=>b.sc-a.sc).slice(0,10);
  const sdIds = S.res.anti.picks.filter(id=>/не потяну|не настолько|сложно поступить|не получится|қолымнан келмейді|жетпейді/i.test(S.res.anti.reasons[id]||""));
  const conflicts = findConflicts();
  const prideFlag = conflicts.some(c=>c.pride);
  const kz = S.lang==='kz';
  app().insertAdjacentHTML("beforeend", `
   <div class="card report">
    <div class="tag" style="background:#3d2038;color:var(--warn)">${kz?"ЕСЕП ЖОБАСЫ · кеңесші растағанға дейін жарияланбайды":"ЧЕРНОВИК ОТЧЕТА · не публикуется до подтверждения консультантом"}</div>
    <h1>${S.profile.name||"—"}${S.profile.age? ", "+S.profile.age:""}</h1>
    <p>${kz?"Трек":"Трек"}: ${{kz:kz?"Қазақстан (ҰБТ)":"Казахстан (ЕНТ)",abroad:kz?"Шетел":"За рубеж",both:kz?"Екі нұсқа":"Оба варианта",undecided:kz?"Анықталмаған — 7-күні талқыланды":"Не определен — обсуждалось в День 7"}[S.profile.track]||"—"} · ${S.profile.city||""}
    ${S.profile.voluntary===false? " · <b style='color:var(--warn)'>"+(kz?"бағдарламаға өз еркімен келмеген":"участие не добровольное")+"</b>":""}</p>

    <h3>1. ${kz?"Кәсіби векторлар (Холланд)":"Профессиональные вектора (Холланд)"}</h3>
    <div class="sec">${bars(riaSorted,1,VEC_NAMES)}
      <p class="ink" style="margin-top:10px"><b>${kz?"Ұсынылатын векторлар":"Рекомендуемые вектора"}:</b> ${topVec.map(x=>T(VEC_NAMES[x[0]])).join(" · ")||"—"}</p></div>

    <h3>2. ${kz?"Жұмыстағы қажеттіліктер (Макклеланд, ойын бойынша)":"Потребности в работе (Макклеланд, по игре)"}</h3>
    <div class="sec">${bars(Object.entries(mcc).sort((a,b)=>b[1]-a[1]),100,NEED_NAMES)}
      ${Object.values(S.res.game.open).filter(Boolean).map(x=>`<p>«${x}»</p>`).join("")}</div>

    <h3>3. ${kz?"Мансап якорьлары (Шейн)":"Якоря карьеры (Шейн)"}</h3>
    <div class="sec">${bars(schSorted.slice(0,5),10,SCH_SCALES,SCH_TIP)}</div>

    <h3>4. ${kz?"Құндылықтар":"Ценности"}</h3>
    <div class="sec">${bars(valSorted.slice(0,5),50,VAL_SCALES,VAL_TIP)}</div>

    <h3>5. ${kz?"Қызығушылықтар (ЛУПа, 7+)":"Интересы (ЛУПа, 7+)"}</h3>
    <div class="sec">${lupaTop.map(x=>`<span class="pill">${T(x)} · ${x.sc}</span>`).join("")||"—"}
      ${Object.entries(S.res.lupa.probes).filter(x=>x[1]).map(x=>`<p>«${x[1]}»</p>`).join("")}</div>

    <h3>6. ${kz?"Антирейтинг (Готтфредсон)":"Антирейтинг (Готтфредсон)"}</h3>
    <div class="sec">${S.res.anti.picks.map(id=>{const p=ANTI.find(x=>x.id===id);
      return `<p><b>${T(p)}:</b> «${S.res.anti.reasons[id]||"—"}»</p>`;}).join("")||"—"}</div>

    ${sdIds.length? `<h3 style="color:var(--warn)">⚠️ ${kz?"Компромисс аймағы (SELFDOUBT)":"Зона компромисса (SELFDOUBT)"}</h3>
    <div class="sec" style="border:1.5px solid var(--warn)">
      <p class="ink">${kz?"Қызығушылықтан емес, «қолымнан келмейді» дегеннен бас тартулар — ықтимал «көмілген армандар»:":"Отказы не из-за интереса, а из-за «не потяну» — возможные «похороненные мечты»:"}</p>
      ${sdIds.map(id=>{const p=ANTI.find(x=>x.id===id); return `<p><b>${T(p)}:</b> «${S.res.anti.reasons[id]}»</p>`;}).join("")}
      ${S.res.synth.q2? `<p class="ink">${kz?"7-күнгі тексеру":"Проверка в День 7"}: «${S.res.synth.q2}»</p>`:""}</div>`:""}

    <h3>7. ${kz?"Мультиғалам (7 өмір)":"Мультивселенная (7 жизней)"}</h3>
    <div class="sec">
      ${(S.res.multi&&S.res.multi.lives?S.res.multi.lives:[]).map((l,i)=>l.who?`<p><b>${i+1}. ${l.who}</b> · ${l.where||"—"}${l.give?" · "+l.give:""}</p>`:"").join("")||"—"}
      ${S.res.multi&&S.res.multi.pride&&S.res.multi.pride.who?`<p style="color:var(--warn)"><b>👑 ${kz?"Мақтаныш ғаламы":"Вселенная Гордости"}: ${S.res.multi.pride.who}</b> · ${S.res.multi.pride.where||"—"}${prideFlag?" · 🚩 "+(kz?"еркін әлемдермен сәйкес емес":"не совпадает со свободными мирами"):""}</p>`:""}
    </div>

    ${conflicts.length? `<h3>8. ${kz?"Ішкі қайшылық гипотезалары":"Гипотезы внутренних конфликтов"}</h3>
    <div class="sec">${conflicts.map((c,i)=>`<p class="ink">• ${T(c)}</p>${S.res.synth["q"+i]?`<p>${kz?"Жауабы":"Ответ"}: «${S.res.synth["q"+i]}»</p>`:""}`).join("")}</div>`:""}

    <h3>9. ${kz?"Үш кит және ақша":"Три кита и деньги"}</h3>
    <div class="sec">
      ${S.res.whales.create?`<p><b>${kz?"Жасайды":"Создает"}:</b> «${S.res.whales.create}»</p>`:""}
      ${S.res.whales.learn?`<p><b>${kz?"Үйренеді":"Учится"}:</b> «${S.res.whales.learn}»</p>`:""}
      ${S.res.whales.give?`<p><b>${kz?"Береді":"Дает"}:</b> «${S.res.whales.give}»</p>`:""}
      <p><b>${kz?"Ақша күтулері":"Денежные ожидания"}:</b> ${(S.res.money.start||0).toLocaleString()} ₸ → ${(S.res.money.pro||0).toLocaleString()} ₸
      ${S.res.money.reflect? `· «${S.res.money.reflect}»`:""}</p></div>

    <h3>10. ${kz?"Кеңесшіге арналған жалаулар":"Флаги для консультанта"}</h3>
    <div class="sec">
      ${S.profile.voluntary===false? `<p>🚩 ${kz?"Өз еркімен емес — мотивацияны тексеру":"Недобровольное участие — проверить мотивацию"}</p>`:""}
      ${prideFlag? `<p>🚩 ${kz?"Отбасылық сценарий (Мақтаныш ғаламы)":"Семейный сценарий (Вселенная Гордости)"}</p>`:""}
      ${sdIds.length? `<p>🚩 SELFDOUBT: ${sdIds.length} ${kz?"мамандық":"проф."}</p>`:""}
      ${(S.res.money.start||0)>500000? `<p>🚩 ${kz?"Бастапқы жалақы күтуі жоғары":"Завышенные стартовые ожидания"}</p>`:""}
      <p>ℹ️ ${kz?"Толық нұсқада мұнда: ИИ-дің «Қосымша түсініктемелер» бөлімінің жобасы (векторлар ішіндегі мамандықтар, негізгі қайшылық, тәуекелдер) — кеңесші растайды/түзетеді.":"В полной версии здесь: сгенерированный ИИ черновик раздела «Дополнительные комментарии» (профессии внутри векторов, ключевой конфликт, риски) — консультант подтверждает/правит."}</p></div>

    <button class="btn" onclick="go('home')">${t("home")}</button>
    <button class="btn ghost" onclick="if(confirm('${kz?"Барлық деректерді өшіру?":"Сбросить все данные прототипа?"}')){localStorage.removeItem('sana_proto');location.reload();}">${kz?"Прототипті қалпына келтіру":"Сбросить прототип"}</button>
   </div>`);
};

render();
</script>
